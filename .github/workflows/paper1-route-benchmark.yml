name: Paper I Route Benchmark

on:
  push:
    branches:
      - feat/paper1-agri-route-benchmark
    paths:
      - 'src/agt_route_benchmark/**'
      - 'src/agt_coverage_planning/**'
      - 'src/agt_offline_assets/**'
      - 'src/agt_map_workbench/**'
      - 'src/agt_map_pipeline/**'
      - 'profiles/platforms/mk_mini.yaml'
      - '.github/workflows/paper1-route-benchmark.yml'
  pull_request:
    paths:
      - 'src/agt_route_benchmark/**'
      - 'src/agt_coverage_planning/**'
      - 'src/agt_offline_assets/**'
      - 'src/agt_map_workbench/**'
      - 'src/agt_map_pipeline/**'
      - 'profiles/platforms/mk_mini.yaml'
      - '.github/workflows/paper1-route-benchmark.yml'

jobs:
  pure-python-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest PyYAML numpy scipy matplotlib pillow shapely PyQt5
      - name: Run real-map freeze offline-assets contracts
        env:
          PYTHONPATH: src/agt_offline_assets:src/agt_ui_bridge:src/agt_coverage_planning
        run: >-
          python -m pytest -q
          src/agt_offline_assets/test/test_navigation_map_freeze_export.py
          src/agt_offline_assets/test/test_navigation_map_derivation.py
          src/agt_offline_assets/test/test_navigation_ablation.py
          src/agt_offline_assets/test/test_vehicle_feasibility.py
          src/agt_offline_assets/test/test_vehicle_collision_envelope.py
          src/agt_offline_assets/test/test_run_navigation_ablation_contract.py
          src/agt_offline_assets/test/test_aisle_blocker_audit.py
          src/agt_offline_assets/test/test_formal_navigation_map.py
          src/agt_offline_assets/test/test_formal_navigation_recovery.py
          src/agt_offline_assets/test/test_formal_navigation_override.py
          src/agt_offline_assets/test/test_formal_navigation_revision.py
          src/agt_offline_assets/test/test_formal_navigation_qa.py
          src/agt_offline_assets/test/test_formal_navigation_usability.py
      - name: Run agricultural terrain, structure, row-track and corridor regressions
        env:
          PYTHONPATH: src/agt_offline_assets:src/agt_ui_bridge:src/agt_coverage_planning
        run: >-
          python -m pytest -q
          src/agt_offline_assets/test/test_terrain_morphology.py
          src/agt_offline_assets/test/test_navigation_structure.py
          src/agt_offline_assets/test/test_navigation_row_tracks.py
          src/agt_offline_assets/test/test_navigation_corridor.py
          src/agt_offline_assets/test/test_navigation_corridor_centerlines.py
          src/agt_offline_assets/test/test_navigation_corridor_boundary_candidates.py
      - name: Run Workbench formal-map and resource-bundle contracts
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src/agt_map_workbench:src/agt_offline_assets:src/agt_ui_bridge:src/agt_coverage_planning
        run: >-
          python -m pytest -q
          src/agt_map_workbench/test/test_navigation_override_metadata.py
          src/agt_map_workbench/test/test_resource_bundle.py
          src/agt_map_workbench/test/test_paper1_resource_bundle_integration.py
          src/agt_map_workbench/test/test_structure_aware_navigation_workbench.py
          src/agt_map_workbench/test/test_review_export.py
          src/agt_map_workbench/test/test_ablation_workbench.py
      - name: Run map pipeline contracts
        env:
          PYTHONPATH: src/agt_map_pipeline:src/agt_offline_assets:src/agt_ui_bridge:src/agt_coverage_planning
        run: python -m pytest -q src/agt_map_pipeline/test
      - name: Run structure-aware map-quality compatibility
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src/agt_route_benchmark:src/agt_coverage_planning:src/agt_offline_assets:src/agt_ui_bridge
        run: python -m pytest -q src/agt_route_benchmark/test/test_map_quality_structure_aware.py
      - name: Run Paper I benchmark unit tests
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src/agt_route_benchmark:src/agt_coverage_planning:src/agt_offline_assets:src/agt_ui_bridge
        run: python -m pytest -q src/agt_route_benchmark/test
      - name: Compile changed Python sources
        if: always()
        run: >-
          python -m compileall -q
          src/agt_route_benchmark/agt_route_benchmark
          src/agt_route_benchmark/scripts
          src/agt_offline_assets/agt_offline_assets
          src/agt_map_workbench/agt_map_workbench
          src/agt_map_pipeline/agt_map_pipeline
          src/agt_map_pipeline/scripts
          src/agt_map_workbench/scripts/paper1_map_workbench_launcher.py
          scripts/run_navigation_ablation.py