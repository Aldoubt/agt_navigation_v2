name: Paper I Route Benchmark

on:
  push:
    branches:
      - feat/paper1-agri-route-benchmark
    paths:
      - 'src/agt_route_benchmark/**'
      - 'src/agt_coverage_planning/**'
      - 'src/agt_offline_assets/**'
      - 'src/agt_map_workbench/**'
      - 'src/agt_map_pipeline/**'
      - 'profiles/platforms/mk_mini.yaml'
      - '.github/workflows/paper1-route-benchmark.yml'
  pull_request:
    paths:
      - 'src/agt_route_benchmark/**'
      - 'src/agt_coverage_planning/**'
      - 'src/agt_offline_assets/**'
      - 'src/agt_map_workbench/**'
      - 'src/agt_map_pipeline/**'
      - 'profiles/platforms/mk_mini.yaml'
      - '.github/workflows/paper1-route-benchmark.yml'

jobs:
  pure-python-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest PyYAML numpy scipy matplotlib pillow shapely
      - name: Run real-map freeze offline-assets contracts
        env:
          PYTHONPATH: src/agt_offline_assets
        run: >-
          python -m pytest -q
          src/agt_offline_assets/test/test_navigation_map_freeze_export.py
          src/agt_offline_assets/test/test_navigation_map_derivation.py
      - name: Run agricultural structure and corridor regressions
        env:
          PYTHONPATH: src/agt_offline_assets
        run: >-
          python -m pytest -q
          src/agt_offline_assets/test/test_navigation_structure.py
          src/agt_offline_assets/test/test_navigation_corridor.py
      - name: Run formal Workbench override metadata contract
        env:
          PYTHONPATH: src/agt_map_workbench:src/agt_offline_assets
        run: python -m pytest -q src/agt_map_workbench/test/test_navigation_override_metadata.py
      - name: Run map pipeline contracts
        env:
          PYTHONPATH: src/agt_map_pipeline:src/agt_offline_assets:src/agt_ui_bridge:src/agt_coverage_planning
        run: python -m pytest -q src/agt_map_pipeline/test
      - name: Run Paper I benchmark unit tests
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src/agt_route_benchmark:src/agt_coverage_planning:src/agt_offline_assets
        run: python -m pytest -q src/agt_route_benchmark/test
      - name: Compile changed Python sources
        run: >-
          python -m compileall -q
          src/agt_route_benchmark/agt_route_benchmark
          src/agt_route_benchmark/scripts
          src/agt_offline_assets/agt_offline_assets
          src/agt_map_workbench/agt_map_workbench/navigation_override_metadata.py
          src/agt_map_workbench/agt_map_workbench/paper1_workbench.py
          src/agt_map_pipeline/agt_map_pipeline
          src/agt_map_pipeline/scripts
          src/agt_map_workbench/scripts/paper1_map_workbench_launcher.py
