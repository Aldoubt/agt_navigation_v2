# Humble baseline definitions. Names are benchmark-stable planner IDs; plugin types
# follow Nav2 Humble's '/' plugin syntax. The State Lattice control set must be
# generated/selected for the accepted map resolution and MK-mini curvature limit
# before formal lattice experiments.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased, ThetaStar, GridBasedHybrid, GridBasedLattice]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.125
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_planning_time: 5.0

    ThetaStar:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      tolerance: 0.125
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: false

    GridBasedHybrid:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.125
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      minimum_turning_radius: 1.5
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 4.5

    GridBasedLattice:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      tolerance: 0.125
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # Development-only default. Formal runs must replace this with a control
      # set generated for MK-mini min_turning_radius=1.5 m and the map resolution.
      lattice_filepath: ""
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 4.5
