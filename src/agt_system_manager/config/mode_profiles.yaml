schema_version: 1
allowed_executables: [ros2, rviz2]
profiles:
  sensor_only:
    mode: SENSOR_ONLY
    description: MID360 sensor adapter only
    command: [ros2, launch, agt_sensor_adapters, mid360.launch.py]
    allowed_argument_keys: [user_config_path, use_sim_time]
  mapping:
    mode: MAPPING
    description: Existing modular mapping chain through agt_bringup
    command: [ros2, launch, agt_bringup, system.launch.py, mode:=mapping, start_system_health:=false]
    allowed_argument_keys: [runtime_dir, user_config_path, platform_profile, map_name, mapping_output_dir, start_sensor, start_chassis, start_chassis_monitor, chassis_backend, can_interface, start_rviz, start_mapping_gui, record_bag, bag_profile, use_sim_time]
  navigation:
    mode: NAVIGATION
    description: Existing modular navigation chain through agt_bringup
    command: [ros2, launch, agt_bringup, system.launch.py, mode:=navigation, start_system_health:=false]
    allowed_argument_keys: [runtime_dir, user_config_path, map_version_id, map, global_map_pcd, global_map_processing_record, map_id, configured_candidates_yaml, last_valid_pose_path, start_sensor, start_chassis, start_chassis_monitor, chassis_backend, can_interface, start_gui, record_bag, bag_profile, auto_relocalize_on_start, use_sim_time]
  qt_mapping:
    mode: MAPPING_FRONTEND
    description: Maintained Qt mapping profile
    command: [ros2, launch, agt_ui_bridge, ros_qt5_gui.launch.py, profile:=mapping]
    allowed_argument_keys: [map, source_map_topic, map_frame_id, use_sim_time]
  qt_navigation:
    mode: NAVIGATION_FRONTEND
    description: Maintained Qt navigation profile
    command: [ros2, launch, agt_ui_bridge, ros_qt5_gui.launch.py, profile:=navigation]
    allowed_argument_keys: [map, source_map_topic, map_frame_id, use_sim_time]
  localization_rviz:
    mode: LOCALIZATION_FRONTEND
    description: RViz debug frontend; it has no TF or command publisher
    command: [rviz2]
    allowed_argument_keys: []
  teach_preview:
    mode: TEACH_PREVIEW
    description: Preview and validate a recorded teach path without motion nodes
    command: [ros2, launch, agt_teach_repeat, teach_preview.launch.py]
    allowed_argument_keys: [manifest, start_rviz, use_sim_time]
  teach_rescan:
    mode: TEACH_RESCAN
    description: Low-speed teach-route rescan using an immutable bootstrap map
    command: [ros2, launch, agt_bringup, teach_mapping_rescan.launch.py]
    allowed_argument_keys: [session, start_chassis, start_gui, can_interface, execution_enabled, record_bag, runtime_dir, rescan_max_speed_mps]
